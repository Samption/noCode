spring:
  application:
    name: noCode-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/noCode
    username: root
    password: 123456
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      # 过期时间
      ttl: 3600
  profiles:
    active: local

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期，与 session 配置保持一致
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.sxl.nocode.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI
langchain4j:
  open-ai:
    chat-model:
      # deekseek
      base-url: https://api.deepseek.com
      model-name: deepseek-chat
      # qwen
      # base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # model-name: qwen-plus

      # 最大token数
      max-tokens: 8192
      # 结构化输出，deepseek严格的json模式
#      strict-json-schema: true
#      response-format: json_object

      # 开启日志
      log-requests: true
      log-responses: true
      timeout: 120s

    # 流式模型
    streaming-chat-model: # 流式模型，不支持结构化输出
      base-url: https://api.deepseek.com
      model-name: deepseek-chat
#      base-url: https://open.bigmodel.cn/api/paas/v4/
#      model-name: "glm-4.7-flash"
      max-tokens: 8192
      log-requests: false
      log-responses: false

    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-reasoner
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-chat
      log-requests: true
      log-responses: true