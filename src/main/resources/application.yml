spring:
  application:
    name: noCode-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/noCode
    username: root
    password: 123456
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      # 过期时间
      ttl: 3600
  profiles:
    active: local

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.sxl.nocode.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI
langchain4j:
  open-ai:
    chat-model:
      # deekseek
      base-url: https://api.deepseek.com
      model-name: deepseek-chat
      # qwen
      # base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # model-name: qwen-plus

      # 最大token数
      max-tokens: 8192
      # 结构化输出，deepseek严格的json模式
      strict-json-schema: true
      response-format: json_object

      # 开启日志
      log-requests: true
      log-responses: true

    streaming-chat-model: # 流式模型，不支持结构化输出
      base-url: https://api.deepseek.com
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: true
      log-responses: true